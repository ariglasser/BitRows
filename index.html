<!doctype html>
<!--
  TETRIS IN THE BROWSER: the page.

  This file only describes WHAT is on the page: a board, a side panel and
  some buttons. It holds no game logic.
    style.css       says how it looks (sizes, colours)
    browser.js      fills the board and reacts to keys and buttons
    tetris-core.js  the game itself (shared with the terminal version)

  Things written between < and > are HTML "tags". Most come in pairs:
  <div> ... </div> is a box with something inside. `id="board"` gives an
  element a name, so the JavaScript can find it. `class="..."` gives it one
  or more labels, which the CSS uses to style it.
-->
<html lang="en">
<head>
  <meta charset="utf-8">
  <!-- Makes the page fit a phone screen instead of a shrunken desktop page. -->
  <meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
  <title>Bit-Row Tetris</title>
  <link rel="stylesheet" href="style.css">

  <!--
    INSTALLABLE APP (PWA = "Progressive Web App")
    manifest.webmanifest tells the phone the app's name, icon and how to open
    it (full screen, without the browser's address bar). sw.js (registered at
    the end of browser.js) makes it work offline.
  -->
  <link rel="manifest" href="manifest.webmanifest">
  <meta name="theme-color" content="#161615">
  <!-- iPhone and iPad read their own tags instead of the manifest: -->
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Tetris">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
</head>
<body>
  <main class="game">
    <!--
      The board. It starts EMPTY: browser.js creates its 200 cells once,
      when the page loads, and never creates or deletes them again.
    -->
    <div class="well">
      <div class="board-wrap">
        <div id="board" class="board"></div>
        <!-- Shown only when paused or game over (browser.js sets the text). -->
        <div id="message" class="message" hidden></div>
      </div>
      <!-- The number of each row, like in the terminal version. -->
      <div id="rownums" class="rownums"></div>
    </div>

    <aside class="panel">
      <div class="label">Next</div>
      <div id="next" class="next"></div>
      <div class="label">Score</div>
      <div id="score" class="value">0</div>
      <div class="label">Lines</div>
      <div id="lines" class="value">0</div>
      <div class="label">Level</div>
      <div id="level" class="value">1</div>
      <button id="pause" class="pause" aria-label="Pause">&#10074;&#10074;</button>
      <!-- Only one of these two hints shows: see the end of style.css. -->
      <p class="hint keys">Keys: arrows move and rotate, space drops, P pauses.</p>
      <p class="hint touch">Drag anywhere to move. Tap to rotate. Flick down to drop.</p>
    </aside>
  </main>

  <!--
    type="module" lets browser.js use `import` to load tetris-core.js.
    (Modules only load from a web server, such as GitHub Pages, not from a
    file opened straight from disk.)
  -->
  <script type="module" src="browser.js"></script>
</body>
</html>
